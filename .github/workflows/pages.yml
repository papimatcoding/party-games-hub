name: Deploy Party Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: party-hub-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate
        run: |
          npm test
          node --check js/app.js
          node --check js/lasers.js
          node --check js/no-repitas.js
          node --check js/patinazo.js
          node --check js/pongagono.js
          node --check js/lavalabras.js
          node --check scripts/preview-wikidata-barca.mjs
          node --check js/config.js
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir -p site
          cp index.html release.json site/
          cp -r css js assets site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
